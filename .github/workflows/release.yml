name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Auto-controle des heuristiques
        run: python3 tools/build_fr.py --selftest

      - name: Generation de l'addon FR
        run: python3 tools/build_fr.py

      - name: Validation structurelle
        run: python3 tools/validate.py

      - name: Les fichiers generes sont-ils a jour ?
        run: |
          if ! git diff --exit-code -- Guidelime_ResurrectedXP_Forever_Alliance_FR RAPPORT-traduction.md; then
            echo "::error::fichiers generes non a jour : relancer tools/build_fr.py et committer le resultat"
            exit 1
          fi

      - name: Archive de l'addon
        run: python3 tools/package.py

      - name: Release GitHub
        uses: softprops/action-gh-release@v3
        with:
          files: dist/Guidelime_ResurrectedXP_Forever_Alliance_FR.zip
          generate_release_notes: false
          body_path: CHANGELOG.md

      - name: Publication CurseForge et Wago
        env:
          CF_PROJECT_ID: ${{ secrets.CF_PROJECT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          WAGO_PROJECT_ID: ${{ secrets.WAGO_PROJECT_ID }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
        run: python3 tools/release.py
