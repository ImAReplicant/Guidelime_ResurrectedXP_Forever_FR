name: release

on:
  push:
    tags: ["v*"]
  # envoi manuel : publie sans creer de release GitHub (utile pour un premier envoi Wago)
  workflow_dispatch:
    inputs:
      only:
        description: "Plateforme a publier"
        type: choice
        default: all
        options: [all, curse, wago]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Auto-controle des heuristiques
        run: python3 tools/build_fr.py --selftest

      - name: Generation de l'addon FR
        run: python3 tools/build_fr.py

      - name: Validation structurelle
        run: python3 tools/validate.py

      - name: Les fichiers generes sont-ils a jour ?
        run: |
          if ! git diff --exit-code -- Guidelime_ResurrectedXP_Forever_Alliance_FR RAPPORT-traduction.md; then
            echo "::error::fichiers generes non a jour : relancer tools/build_fr.py et committer le resultat"
            exit 1
          fi

      - name: Archive de l'addon
        run: python3 tools/package.py

      - name: Notes de version
        run: python3 tools/release.py --notes "$RUNNER_TEMP/release-notes.md"

      # uniquement sur un tag : un envoi manuel n'a pas de release GitHub a creer
      - name: Release GitHub
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/Guidelime_ResurrectedXP_Forever_Alliance_FR.zip
          generate_release_notes: false
          body_path: ${{ runner.temp }}/release-notes.md

      - name: Publication CurseForge et Wago
        env:
          CF_PROJECT_ID: ${{ secrets.CF_PROJECT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          WAGO_PROJECT_ID: ${{ secrets.WAGO_PROJECT_ID }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          # tag = version publiee ; envoi manuel = beta (comme le premier fichier Curse)
          CF_RELEASE_TYPE: ${{ github.event_name == 'push' && 'release' || 'beta' }}
          ONLY: ${{ inputs.only }}
        run: |
          if [ -n "$ONLY" ] && [ "$ONLY" != "all" ]; then
            python3 tools/release.py --only "$ONLY"
          else
            python3 tools/release.py
          fi
