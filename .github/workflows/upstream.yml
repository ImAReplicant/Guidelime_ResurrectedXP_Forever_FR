name: upstream

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Aucune cle requise : les metadonnees viennent de cfwidget, l'archive de mediafilez.
      # Sortie 2 = nouvelle version disponible, 0 = a jour, 1 = erreur (cfwidget injoignable).
      - name: Nouvelle version de l'addon anglais ?
        id: check
        run: |
          set +e
          python3 tools/update_upstream.py --check
          code=$?
          set -e
          case "$code" in
            0) exit 0 ;;
            2) echo "update=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$code" ;;
          esac

      - name: Mise a jour et regeneration
        if: steps.check.outputs.update == 'true'
        id: apply
        run: |
          python3 tools/update_upstream.py --apply
          python3 tools/extract.py
          python3 tools/build_fr.py
          python3 tools/validate.py
          python3 tools/package.py
          version=$(grep '^## Version:' upstream/Guidelime_ResurrectedXP_Forever_Alliance/Guidelime_ResurrectedXP_Forever_Alliance.toc | cut -d' ' -f3)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Corps de la pull request
        if: steps.check.outputs.update == 'true'
        id: body
        run: |
          {
            echo "## Guides modifies"
            echo '```'
            git diff --stat -- upstream/ | tail -n 30
            echo '```'
            echo
            echo "## Restes a traduire"
            sed -n '/^| Element/,/^$/p' RAPPORT-traduction.md
          } > /tmp/body.md
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/body.md >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Pull request
        if: steps.check.outputs.update == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: upstream/${{ steps.apply.outputs.version }}
          title: "Upstream ${{ steps.apply.outputs.version }}"
          commit-message: "Upstream ${{ steps.apply.outputs.version }} : guides anglais et traduction regeneres"
          body: ${{ steps.body.outputs.body }}
          delete-branch: true
