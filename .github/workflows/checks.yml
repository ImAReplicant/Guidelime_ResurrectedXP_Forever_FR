name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Guidelime n'est pas installe ici : extract.py n'est pas relance (les instantanes du
      # glossaire sont versionnes) et validate.py saute les controles de balises/zones.
      - name: Auto-controle des heuristiques
        run: python3 tools/build_fr.py --selftest

      - name: Auto-controle de la mise a jour amont
        run: python3 tools/update_upstream.py --selftest

      - name: Generation de l'addon FR
        run: python3 tools/build_fr.py

      - name: Validation structurelle
        run: python3 tools/validate.py

      - name: Les fichiers generes sont-ils a jour ?
        run: |
          if ! git diff --exit-code -- Guidelime_ResurrectedXP_Forever_Alliance_FR RAPPORT-traduction.md; then
            echo "::error::fichiers generes non a jour : relancer tools/build_fr.py et committer le resultat"
            exit 1
          fi

      - name: Archive de l'addon
        run: python3 tools/package.py

      - uses: actions/upload-artifact@v4
        with:
          name: Guidelime_ResurrectedXP_Forever_Alliance_FR
          path: dist/*.zip
